; PlatformIO Project Configuration File
[platformio]
default_envs =
	esp32-s3-devkitc-1-psram

build_cache_dir = .pio/buildcache
cache_dir = .pio/cache
boards_dir = boards/_jsonfiles

extra_configs =
	boards/*.ini
	boards/*/*.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip ; Arduino 3.3.9 for 10
platform_packages = framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/builds/main_esp32-arduino-libs-20260826-181233.tar.gz ; Arduino 3.3.10 with exFAT support

monitor_filters = esp32_exception_decoder, send_on_enter, colorize
monitor_speed = 115200
framework = arduino
board_build.variants_dir = boards
board_build.filesystem = littlefs
build_src_flags =
	-Wall
	-Wclobbered
	-Wempty-body
	-Wignored-qualifiers
	-Woverloaded-virtual=0
	-Wtype-limits
	-Wno-unused-label
	-Wno-comment
	-Wno-unused-variable
	-Wno-narrowing
	-D ENABLE_RAM_LOGGING=1

build_src_filter =
	+<*>
	-<.git/>
	-<.svn/>
	-<modules/bjs_interpreter/mqjs_stdlib.c>

build_flags =
	-DBRUCE_VERSION='"dev"'
	-DEEPROMSIZE=128
	-DLH=8
	-DLW=6
	-flto
	-ffunction-sections
	-fdata-sections
	-Os
	-Wl,--print-memory-usage
	-Wl,--gc-sections
	-DGIT_COMMIT_HASH='"Homebrew"'
	-DFASTLED_RMT_BUILTIN_DRIVER=1
	-Werror=odr
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1
	-DCONFIG_ASYNC_TCP_USE_WDT=0
	-DGEN_MQJS_HEADERS
	-I include
	-DMBEDTLS_CONFIG_FILE=\"mbedtls/esp_config.h\"
	-DCONFIG_MBEDTLS_ECDH_C=1
	-DCONFIG_MBEDTLS_AES_C=1
	-DCONFIG_MBEDTLS_CTR_DRBG_C=1
	-D BRUCE_NO_SDR_JAMMER=1

extra_scripts =
	pre:check_submodules.py
	pre:patch.py
	pre:pre_build_current_year.py
	pre:gen_mqjs_headers.py
	pre:patch_library_conflicts.py
	flto_prep.py
	post:build.py

lib_deps =
	https://github.com/sayacom/WireGuard-ESP32-Arduino#feature/esp-netif
	https://github.com/bmorcelli/IRremoteESP8266
	paulstoffregen/Time@1.6.1
	LibSSH-ESP32
	Adafruit BusIO=symlink://lib/Adafruit-BusIO
	Adafruit PN532=symlink://lib/Adafruit-PN532
	https://github.com/huckor/BER-TLV.git
	https://github.com/rennancockles/Arduino_MFRC522v2.git
	https://github.com/bmorcelli/ESP-ChameleonUltra
	https://github.com/bmorcelli/ESP-Amiibolink
	https://github.com/rennancockles/SimpleCLI
	https://github.com/whywilson/ESP-PN532BLE
	https://github.com/whywilson/ESP-PN532-UART
	https://github.com/whywilson/ESP-PN532Killer
	NTPClient@3.2.1
	ESP32Time@2.0.6
	FFat
	bblanchon/ArduinoJson
	ESP8266Audio@^2.4.1
	earlephilhower/ESP8266SAM@^1.1.0
	mikalhart/TinyGPSPlus
	tinyu-zhao/FFT@^0.0.1
	h2zero/NimBLE-Arduino@2.5.1
	nrf24/RF24 @ 1.4.11
	Adafruit Si4713 Library@1.2.3
	Bodmer/JPEGDecoder
	https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib/
	mquickjs=https://github.com/BruceDevices/mquickjs#0.0.6
	https://github.com/bmorcelli/OneWire#patch-1
	https://github.com/bmorcelli/ESP32-PsRamFS#patch-1
	bitbank2/AnimatedGIF
	bitbank2/PNGdec @ ^1.1.2
	ESP32Async/ESPAsyncWebServer
	fastled/FastLED @ 3.10.3
	jgromes/RadioLib @ ^7.4.0
	https://github.com/lewisxhe/ST25R3916-fork#0c8e00f49d12881d1cff6d6f0879b90ce7ed4033
	https://github.com/lewisxhe/NFC-RFAL-fork#7bde4587ea44c36c178a43d083d7a7345c1e4cfe

; ==========================================
; БАЗОВЫЕ СЕКЦИИ
; ==========================================
[env_light]
extends = env
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
	-DLITE_VERSION=1
	-D_IR_ENABLE_DEFAULT_=false
	-DDECODE_NEC=true
	-DSEND_NEC=true
	-DDECODE_SAMSUNG=true
	-DSEND_SAMSUNG=true
	-DDECODE_RC5=true
	-DSEND_RC5=true
	-DDECODE_RC6=true
	-DSEND_RC6=true
	-DDECODE_LG=true
	-DSEND_LG=true
	-DDECODE_SONY=true
	-DSEND_SONY=true
	-DSEND_PANASONIC=true
	-DDECODE_PANASONIC=true
	-DSEND_RAW=true

lib_deps =
	https://github.com/BorisKofman/IRremoteESP8266#Espressif-version-3
	paulstoffregen/Time@1.6.1
	Adafruit BusIO=symlink://lib/Adafruit-BusIO
	Adafruit PN532=symlink://lib/Adafruit-PN532
	https://github.com/rennancockles/Arduino_MFRC522v2.git
	https://github.com/bmorcelli/ESP-ChameleonUltra
	https://github.com/rennancockles/SimpleCLI
	NTPClient@3.2.1
	ESP32Time@2.0.6
	FFat
	bblanchon/ArduinoJson@7.4.2
	mikalhart/TinyGPSPlus@1.1.0
	tinyu-zhao/FFT@0.0.1
	h2zero/NimBLE-Arduino@2.5.1
	nrf24/RF24 @ 1.4.11
	Bodmer/JPEGDecoder
	https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib/
	ESP32Async/AsyncTCP@3.4.10
	ESP32Async/ESPAsyncWebServer@3.9.6

[env_4mb]
extends = env
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
	-D_IR_ENABLE_DEFAULT_=false
	-DDECODE_HASH=true
	-DDECODE_NEC=true
	-DSEND_NEC=true
	-DDECODE_SAMSUNG=true
	-DSEND_SAMSUNG=true
	-DDECODE_RC5=true
	-DSEND_RC5=true
	-DDECODE_RC6=true
	-DSEND_RC6=true
	-DDECODE_LG=true
	-DSEND_LG=true
	-DDECODE_SONY=true
	-DSEND_SONY=true
	-DSEND_PANASONIC=true
	-DDECODE_PANASONIC=true
	-DSEND_RAW=true

lib_ignore =
	FastLED
	ESP8266Audio
	ESP8266SAM

; ==========================================
; ВАШ КАСТОМНЫЙ БИЛД (ST7735 + 3 КНОПКИ)
; ==========================================
[env:custom_s3_st7735_buttons]
extends = env
board = esp32s3
board_build.variant = pinouts
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB

build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-I boards/pinouts
	; --- Кнопки (GPIO 47, 14, 0) ---
	-DHAS_BTN=1
	-DSEL_BTN=47
	-DUP_BTN=14
	-DDW_BTN=0
	-DBTN_ACT=LOW
	; --- Экран ST7735 (1.8" 128x160) ---
	-DST7735_DRIVER=1
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DTFT_CS=10
	-DTFT_DC=46
	-DTFT_RST=9
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_BL=45
	-DTFT_BACKLIGHT_ON=HIGH
